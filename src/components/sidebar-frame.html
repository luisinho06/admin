<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/styles.css" rel="stylesheet">
    <style>
      html, body { min-width: 0; min-height: 100%; margin: 0; }
      body { overflow: hidden; background: #fff; }
      .sidebar-mobile-toggle { display: none !important; }
      .sidebar-mobile-header { display: none !important; }
      .app-sidebar {
        position: static !important;
        display: block !important;
        width: 264px !important;
        min-height: 100vh !important;
        visibility: visible !important;
        transform: none !important;
        border: 0 !important;
      }
      .app-sidebar .sidebar-body { min-height: 100vh !important; }
      .compact-sidebar .app-sidebar { width: 100% !important; min-height: 64px !important; }
      .compact-sidebar .app-sidebar .sidebar-body {
        min-height: 64px !important;
        flex-direction: row !important;
        align-items: center;
        gap: 12px;
        padding: 8px 12px !important;
      }
      .compact-sidebar .sidebar-brand { flex: 0 0 auto; margin: 0 !important; }
      .compact-sidebar .sidebar-brand-mark { width: 36px; height: 36px; }
      .compact-sidebar .sidebar-brand-name { font-size: 17px; }
      .compact-sidebar .sidebar-brand-name small,
      .compact-sidebar .sidebar-workspace,
      .compact-sidebar .sidebar-section-label,
      .compact-sidebar .sidebar-link:not([href="../views/useradmin.html"]),
      .compact-sidebar .sidebar-account { display: none !important; }
      .compact-sidebar .sidebar-navigation { margin: 0; }
      .compact-sidebar .sidebar-link { min-height: 38px; margin: 0 !important; }
    </style>
  </head>
  <body>
    <div id="sidebar-container"></div>
    <script>
      async function loadSidebar() {
        const container = document.querySelector("#sidebar-container");
        try {
          const response = await fetch("./sidebar.html");
          if (!response.ok) {
            throw new Error(`Error ${response.status}`);
          }

          container.innerHTML = await response.text();
          container.querySelectorAll("a").forEach((link) => {
            link.target = "_top";
          });
          const usersLink = container.querySelector('a[href="../views/useradmin.html"]');
          if (usersLink) {
            container.querySelectorAll(".sidebar-link.active").forEach((link) => {
              link.classList.remove("active");
              link.removeAttribute("aria-current");
            });
            usersLink.classList.add("active");
            usersLink.setAttribute("aria-current", "page");
          }

          const updateLayout = () => {
            const isCompact = window.parent.innerWidth < 768;
            document.documentElement.classList.toggle("compact-sidebar", isCompact);
            const height = isCompact ? 64 : window.parent.innerHeight;
            window.parent.postMessage({ type: "sidebar-height", height }, window.location.origin);
          };

          window.addEventListener("message", (event) => {
            if (event.origin !== window.location.origin ||
                event.source !== window.parent ||
                event.data?.type !== "sidebar-layout") {
              return;
            }

            document.documentElement.classList.toggle("compact-sidebar", event.data.compact === true);
          });
          window.addEventListener("resize", updateLayout);
          updateLayout();
        } catch (error) {
          console.error("No se pudo cargar el sidebar:", error);
          container.textContent = "No se pudo cargar el menú lateral.";
        }
      }

      loadSidebar();
    </script>
  </body>
</html>
